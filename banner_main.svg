<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Smart Grocery Store Management System</title>
<desc id="d">Banner with a shopping basket holding milk, bread and an apple, and the project title.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c3524"/><stop offset="1" stop-color="#1f7a4d"/></linearGradient>
<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity=".12"/></pattern>
</defs>
<style>
text{font-family:"Segoe UI",Helvetica,Arial,sans-serif}
.m{font-family:Consolas,"Courier New",monospace}
.in{opacity:0;animation:fin .8s ease forwards}
.d1{animation-delay:.1s}.d2{animation-delay:.4s}.d3{animation-delay:.7s}.d4{animation-delay:1s}
@keyframes fin{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.bob{animation:bob 3s ease-in-out infinite;transform-box:fill-box}
.b2{animation-delay:.5s}.b3{animation-delay:1s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.bar{animation:slide 4s ease-in-out infinite alternate}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(420px)}}
@media (prefers-reduced-motion:reduce){.in{opacity:1;animation:none}.bob,.bar{animation:none}}
</style>
<rect width="1200" height="320" fill="url(#bg)"/>
<rect width="1200" height="320" fill="url(#dots)"/>
<circle cx="960" cy="170" r="150" fill="#ffffff" fill-opacity=".06"/>

<g>
<text class="in d1" x="60" y="118" font-size="58" font-weight="800" fill="#ffffff">Smart Grocery Store</text>
<text class="in d2" x="60" y="176" font-size="40" font-weight="600" fill="#f0a047">Management System</text>
<text class="in d3" x="60" y="222" font-size="20" fill="#cfe6d9">Menu-driven console app for products, stock, sales and reports</text>
<g class="in d4" font-size="15" text-anchor="middle" fill="#ffffff">
<rect x="60" y="244" width="124" height="32" rx="16" fill="#ffffff" fill-opacity=".14" stroke="#ffffff" stroke-opacity=".4"/><text class="m" x="122" y="265">Python 3.6+</text>
<rect x="194" y="244" width="69" height="32" rx="16" fill="#ffffff" fill-opacity=".14" stroke="#ffffff" stroke-opacity=".4"/><text class="m" x="228.500" y="265">Lists</text>
<rect x="273" y="244" width="132" height="32" rx="16" fill="#ffffff" fill-opacity=".14" stroke="#ffffff" stroke-opacity=".4"/><text class="m" x="339" y="265">Dictionaries</text>
<rect x="415" y="244" width="69" height="32" rx="16" fill="#ffffff" fill-opacity=".14" stroke="#ffffff" stroke-opacity=".4"/><text class="m" x="449.500" y="265">Loops</text>
<rect x="494" y="244" width="105" height="32" rx="16" fill="#ffffff" fill-opacity=".14" stroke="#ffffff" stroke-opacity=".4"/><text class="m" x="546.500" y="265">Functions</text>
</g>
</g>

<path d="M890 168 C890 80 1030 80 1030 168" fill="none" stroke="#f0a047" stroke-width="10" stroke-linecap="round"/>

<g class="bob">
<polygon points="880,104 903,86 926,104" fill="#dfe9e4"/>
<rect x="880" y="104" width="46" height="90" rx="4" fill="#ffffff"/>
<rect x="886" y="124" width="34" height="30" rx="3" fill="#4aa3df"/>
<text x="903" y="144" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">MILK</text>
</g>
<g class="bob b2">
<rect x="940" y="112" width="70" height="84" rx="30" fill="#d9a35b"/>
<path d="M956 130 l14 12 M974 124 l14 12 M992 130 l10 9" stroke="#b57c36" stroke-width="4" stroke-linecap="round" fill="none"/>
</g>
<g class="bob b3">
<circle cx="1046" cy="140" r="27" fill="#d9453d"/>
<path d="M1046 114 q2 -12 10 -16" stroke="#6b4a2b" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M1048 113 q12 -16 26 -10 q-6 14 -26 10" fill="#4cc790"/>
</g>

<path d="M852 178 H1078 L1048 262 Q1045 274 1033 274 H897 Q885 274 882 262 Z" fill="#e8871e"/>
<rect x="842" y="166" width="246" height="18" rx="9" fill="#f0a047"/>
<path d="M905 192 V258 M965 192 V268 M1025 192 V258" stroke="#b86a12" stroke-width="3" stroke-linecap="round" opacity=".7"/>

<rect y="312" width="1200" height="8" fill="#ffffff" fill-opacity=".1"/>
<rect class="bar" x="60" y="312" width="180" height="8" rx="4" fill="#f0a047"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
